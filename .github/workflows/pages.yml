name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot 4.5.1 and Web export template
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl -fL --retry 3 "$release/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$release/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j /tmp/templates.tpz 'templates/web_nothreads_release.zip' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Import and export game
        run: |
          godot --headless --editor --import --quit
          mkdir -p build/web
          godot --headless --export-release Web "build/web/game-${GITHUB_SHA}.html"
          cp "build/web/game-${GITHUB_SHA}.html" build/web/index.html
          cp loading-status.js build/web/loading-status.js
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

